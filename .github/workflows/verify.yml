name: Verify static portfolio

on:
  push:
    branches: [drill]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static entry points
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f projects.js
          test -f public/portfolio-favicon.png
          test -f public/yehyun_logo.png
          test ! -e package.json
          test ! -e vite.config.js
          test ! -e src/App.jsx
          test ! -e src/main.jsx
          test ! -e src/projects.js
          test ! -e src/styles.css
          node --check app.js
          node --check projects.js
          ! grep -R "from 'react'\|from 'react-dom'\|@vitejs/plugin-react" --exclude-dir=.git --exclude-dir=.github --exclude='*.yml' .
