name: Verify static portfolio

on:
  push:
    branches: [drill, drill-oauth-rebuild, drill-oauth-token-fix, drill-auth-rebuild, drill-auth-rebuild-fix, drill-firebase-auth, drill-loading-fix, drill-auth-feedback, drill-drive-callback-fix, drill-fetch-timeout-fix]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static entry points
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f firebase-auth.js
          test -f config.js
          test -f public/portfolio-favicon.png
          test -f public/yehyun_logo.png
          test ! -e package.json
          test ! -e vite.config.js
          test ! -e src/App.jsx
          test ! -e src/main.jsx
          test ! -e src/projects.js
          test ! -e src/styles.css
          grep -q 'bootstrap@5.3.8/dist/css/bootstrap.min.css' index.html
          grep -q 'bootstrap-icons@1.13.1/font/bootstrap-icons.min.css' index.html
          grep -q 'integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"' index.html
          grep -q "type=\"module\" src=\"./app.js\"" index.html
          grep -q "import('./firebase-auth.js')" app.js
          ! grep -x 'async' app.js
          grep -q 'portfolio_start_failed' app.js
          grep -q "script-src 'self' https://cdn.jsdelivr.net https://www.gstatic.com https://apis.google.com" index.html
          grep -q 'swiper@11.2.10/swiper-bundle.min.css' index.html
          grep -q 'swiper@11.2.10/swiper-bundle.min.js' index.html
          grep -q 'sha384-2UI1PfnXFjVMQ7/ZDEF70CR943oH3v6uZrFQGGqJYlvhh4g6z6uVktxYbOlAczav' index.html
          grep -q 'sha384-gAPqlBuTCdtVcYt9ocMOYWrnBZ4XSL6q+4eXqwNycOr4iFczhNKtnYhF3NEXJM51' index.html
          grep -q 'class="swiper gallery-swiper"' index.html
          grep -q 'class="swiper-wrapper"' index.html
          test -f public/gallery-title.png
          test -f public/gallery-corner-frame.png
          test -f public/gallery-pagination-active.png
          grep -q 'gallery-title.png' index.html
          grep -q 'gallery-corner-frame.png' index.html
          grep -q 'gallery-pagination-active.png' index.html
          grep -q 'mail.google.com/mail/?view=cm&amp;fs=1&amp;to=ajas03974%40gmail.com' index.html
          grep -q 'target="_blank" rel="noopener noreferrer"' index.html
          grep -q 'top: 650px' styles.css
          grep -q 'top: 513px' styles.css
          grep -q 'top: 396px' styles.css
          grep -q 'width: 15px' styles.css
          grep -q 'width: 35px' styles.css
          grep -q 'background: #FAF7E9' styles.css
          grep -q 'translateX(calc(-50% + 20px))' styles.css
          grep -q 'top: 650px' styles.css
          grep -q 'top: 526px' styles.css
          grep -q 'top: 513px' styles.css
          grep -q 'top: 398px' styles.css
          grep -q 'top: 396px' styles.css
          grep -q 'top: 294px' styles.css
          grep -q 'drop-shadow(-5px 5px 0 rgba(0, 0, 0, 1))' styles.css
          grep -q 'drop-shadow(5px 5px 0 rgba(0, 0, 0, 1))' styles.css
          grep -q 'drop-shadow(-5px -5px 0 rgba(0, 0, 0, 1))' styles.css
          grep -q 'drop-shadow(5px -5px 0 rgba(0, 0, 0, 1))' styles.css
          grep -q 'new window.Swiper' app.js
          grep -q "slidesPerView: 'auto'" app.js
          grep -q 'centeredSlides: true' app.js
          grep -q 'realIndexChange' app.js
          grep -q 'delay: 3000' app.js
          ! grep -q 'gallery-track\|startGalleryLoop' app.js
          grep -q "getBearer(request) ? await requireUser(request, env) : null" worker/src/index.js
          grep -q "verifyAuthSession({ reportError: true })" app.js
          grep -q 'signInWithEmailAndPassword' firebase-auth.js
          grep -q 'signInWithPopup' firebase-auth.js
          grep -q 'linkWithPopup' firebase-auth.js
          grep -q 'firebase:' config.js
          ! grep -q 'firebase: null' config.js
          ! grep -q 'bootstrap.bundle.min.js\|bootstrap.min.js\|@popperjs' index.html
          node --input-type=module --check < app.js
          node --input-type=module --check < firebase-auth.js
          test -f worker/src/index.js
          test -f worker/schema/001_initial.sql
          test -f worker/schema/010_drive_storage_root.sql
          grep -q '/api/auth/session' worker/src/index.js
          grep -q '/api/admin/drive/start' worker/src/index.js
          grep -q 'verifyFirebaseToken(token, env)' worker/src/index.js
          grep -q 'requireUser' worker/src/index.js
          grep -q 'Access-Control-Allow-Headers.*, Authorization\|Authorization, Content-Type' worker/src/index.js
          grep -q 'function decodeBytes' worker/src/index.js
          grep -q 'async function fetchWithTimeout' worker/src/index.js
          grep -q 'fetchWithTimeout(' worker/src/index.js
          ! grep -q 'googleSubjectFromIdToken' worker/src/index.js
          grep -q "VALUES ('primary', ?, NULL, ?, ?, ?, ?)" worker/src/index.js
          grep -q 'driveCallbackMessages' app.js
          grep -q 'consumeDriveCallbackHash' app.js
          grep -q "getOrCreateDriveFolder(accessToken, 'Backups', rootId)" worker/src/index.js
          grep -q 'drive_storage_roots' worker/src/index.js
          grep -q "google-link-form" app.js
          grep -q "data-action=\"drive-connect\"" index.html
          grep -q 'author_uid' worker/src/index.js
          ! grep -Eq '/api/auth/google/start|/api/auth/login|/api/auth/ticket|/api/auth/logout|/api/admin/google/link/start|auth_sessions|auth_callback_tickets|accounts:update|admin_google_setup_states|firebase_id_token_ciphertext|startFirebaseGoogleLogin|finishFirebaseGoogleLogin|loginAdmin' worker/src/index.js
          ! grep -q 'password_salt\|password_hash\|ADMIN_EMAIL' worker/src/index.js
          ! sed -n '/id="guestbook-form"/,/\/form>/p' index.html | grep -q 'name="password"'
          ! grep -R "BEGIN PRIVATE KEY\|GOCSPX-[0-9A-Za-z_-]\{20,\}\|ADMIN_PIN\|4896\|1234" --exclude-dir=.git --exclude-dir=.github --exclude='*.example' .
          ! grep -R "from 'react'\|from 'react-dom'\|@vitejs/plugin-react" --exclude-dir=.git --exclude-dir=.github --exclude='*.yml' .
          npx --yes wrangler@4.121.0 deploy --dry-run --config worker/wrangler.toml
