name: Apply D1 session migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_SESSION_MIGRATION only if migrations 001 and 002 already succeeded"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apply-d1-migrations
  cancel-in-progress: false

jobs:
  apply:
    if: inputs.confirmation == 'APPLY_SESSION_MIGRATION'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply administrator session schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute yehyun-portfolio --remote --file=worker/schema/003_admin_sessions.sql
      - name: Verify administrator session table
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute yehyun-portfolio --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name='admin_sessions';"
